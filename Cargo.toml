[package]
name = "inkwash-server"
version = "0.6.0"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.7", features = ["json"] }
dotenvy = "0.15"
# The Alarm/Todo/Repeat/InboxItem wire types (models.rs) are re-exports of
# this crate's definitions rather than a hand-duplicated copy - see its
# doc comments in ../inkwash/logic/src/. Pinned to a specific commit for
# reproducible builds; bump `rev` when inkwash-logic changes and this repo
# wants the update.
# scripts/check-logic-pin.sh reports when this pin is behind the firmware
# repo's logic/ HEAD; the wire-contract fixture tests in src/models.rs
# fail if the pinned shapes drift from docs/sync-api.md.
inkwash-logic = { git = "https://github.com/counhopig/inkwash-firmware", rev = "0ba59585807dd5563bcb8c7ff9a948315f08f409" }
rand = "0.8"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TypeScript bindings for the admin console (admin-ui/src/lib/generated/) are
# derived from the wire DTOs in src/models.rs via #[derive(TS)]; `cargo test`
# regenerates them (see models.rs). serde-compat (default feature) keeps serde
# rename/skip attributes in sync with the JSON shape.
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
