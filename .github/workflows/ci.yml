name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: cargo test + admin-ui build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inkwash
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inkwash"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Node (for the embedded admin-ui build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      # build.rs panics when admin-ui/node_modules is missing, so the UI
      # tooling must be installed before any cargo invocation.
      - name: Install admin-ui tooling
        run: npm install --prefix admin-ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Test PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/inkwash
        run: cargo test --locked
